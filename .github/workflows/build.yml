name: Build Custom GKI Kernel (KOWX712 KernelSU + SUSFS + BBRv3)

on:
  workflow_dispatch:
    inputs:
      os_patch_level:
        description: "'lts' = rolling LTS branch. Or pin an exact GKI release tag, e.g. android12-5.10.264_r00"
        required: true
        default: "android12-5.10.264_r00"
      susfs_commit:
        description: "SUSFS commit hash (leave empty = latest on gki-android12-5.10 branch)"
        required: false
        default: ""
      device_name:
        description: "Optional label for artifact naming"
        required: false
        default: "gki-custom"
      enable_gaming_perf_tune:
        description: "Enable gaming/latency perf tweaks"
        required: true
        default: "false"
      enable_performance_governor:
        description: "Force CPU default governor to 'performance'"
        required: true
        default: "false"

env:
  VERSION: android12-5.10
  CCACHE_DIR: /home/runner/.ccache

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get clean

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl bc bison flex libssl-dev \
            build-essential python3 python3-pip libncurses-dev \
            ccache zip unzip device-tree-compiler libelf-dev

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up ccache
        run: mkdir -p "${CCACHE_DIR}"

      - name: Resolve manifest branch and optional pinned release tag
        run: |    
          set -euo pipefail
          INPUT="${{ github.event.inputs.os_patch_level }}"
          if [ "${INPUT}" = "lts" ]; then
            MANIFEST_REF="common-${VERSION}-lts"
            PIN_REF=""
            PIN_TYPE=""
          elif [[ "${INPUT}" =~ ^${VERSION}.[0-9]+_r[0-9]+$ ]]; then
            MANIFEST_REF="common-${VERSION}"
            PIN_REF="${INPUT}"
            PIN_TYPE="tag"
          else
            MANIFEST_REF="common-${VERSION}"
            PIN_REF="${INPUT}"
            PIN_TYPE="branch"
          fi
          echo "MANIFEST_REF=${MANIFEST_REF}" >> "$GITHUB_ENV"
          echo "PIN_REF=${PIN_REF}" >> "$GITHUB_ENV"
          echo "PIN_TYPE=${PIN_TYPE}" >> "$GITHUB_ENV"

      - name: Sync GKI kernel source
        run: |
          set -euo pipefail
          mkdir -p kernel_workspace
          cd kernel_workspace
          repo init -u https://android.googlesource.com/kernel/manifest -b "${MANIFEST_REF}" --depth=1
          repo sync -c --current-branch --no-clone-bundle --no-tags -j"$(nproc)"

      - name: Pin kernel/common to exact tag or dated maintenance branch
        if: ${{ env.PIN_TYPE != '' }}
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          REMOTE_NAME="$(git remote | head -n1)"
          [ -n "${REMOTE_NAME}" ]
          if [ "${PIN_TYPE}" = "tag" ]; then
            git fetch --depth=1 "${REMOTE_NAME}" "refs/tags/${PIN_REF}:refs/tags/${PIN_REF}"
            git checkout "refs/tags/${PIN_REF}"
          else
            git fetch --depth=1 "${REMOTE_NAME}" "refs/heads/${PIN_REF}:refs/remotes/${REMOTE_NAME}/${PIN_REF}"
            git checkout -B "${PIN_REF}" "refs/remotes/${REMOTE_NAME}/${PIN_REF}"
          fi

      - name: Detect kernel sublevel
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          SUBLEVEL="$(grep -m1 '^SUBLEVEL = ' common/Makefile | awk '{print $3}')"
          echo "SUBLEVEL=${SUBLEVEL}" >> "$GITHUB_ENV"

      - name: Clone SUSFS4KSU
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10 susfs4ksu
          cd susfs4ksu
          if [ -n "${{ github.event.inputs.susfs_commit }}" ]; then
            git checkout "${{ github.event.inputs.susfs_commit }}"
          fi
          echo "SUSFS_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set SUSFS, Ptrace, eBPF & Unicode Configs
        run: |
          cd kernel_workspace/common/arch/arm64/configs
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_SYSCALL_HOOK=y"
            echo "CONFIG_KPROBES=y"
            echo "CONFIG_KRETPROBES=y"
            echo "CONFIG_HAVE_SYSCALL_TRACEPOINTS=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y"
            
            # --- PTRACE FIXES & HARDENING CONFIGS ---
            echo "CONFIG_HAVE_ARCH_PTRACE=y"
            echo "CONFIG_PTRACE=y"
            
            # --- FULL eBPF SUPPORT CONFIGS & PATCHES ---
            echo "CONFIG_BPF=y"
            echo "CONFIG_BPF_SYSCALL=y"
            echo "CONFIG_BPF_JIT=y"
            echo "CONFIG_BPF_JIT_ALWAYS_ON=y"
            echo "CONFIG_NET_CLS_ACT=y"
            echo "CONFIG_NET_ACT_BPF=y"
            echo "CONFIG_NET_CLS_BPF=y"
            echo "CONFIG_CGROUP_BPF=y"
            echo "CONFIG_BPF_EVENTS=y"
            echo "CONFIG_BPF_STREAM_PARSER=y"
            echo "CONFIG_LWTUNNEL_BPF=y"
            
            # --- UNICODE & UTF-8 FIXES CONFIGS ---
            echo "CONFIG_UNICODE=y"
            echo "CONFIG_NLS_UTF8=y"
            echo "CONFIG_NLS_CODEPAGE_437=y"
            echo "CONFIG_NLS_ISO8859_1=y"
          } >> gki_defconfig

      - name: Copy SUSFS kernel patches
        run: |
          cd kernel_workspace/common
          cp ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch ./

      - name: Apply android12-5.10 pre-patch compatibility fixes
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          if [ "${SUBLEVEL}" -le "43" ]; then
            perl -i -pe 's/(int|size_t)\s+this_len\s*=\s*min_t\s*\(\s*[^,]+,/size_t this_len = min_t(size_t,/' fs/proc/base.c
          fi
          if [ "${SUBLEVEL}" -le "117" ]; then
            sed -i '#^[[:space:]]*/*$#,#^[[:space:]]*u32 mask = mark->mask & IN_ALL_EVENTS;$#d' fs/notify/fdinfo.c
            perl -i -pe 's/\bmask,\s*mark->ignored_mask/inotify_mark_user_mask(mark)/g' fs/notify/fdinfo.c
            perl -i -pe 's/ignored_mask:%x/ignored_mask:0/g' fs/notify/fdinfo.c
          fi

      - name: Apply SUSFS kernel patch
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          patch -p1 --fuzz=3 < 50_add_susfs_in_gki-android12-5.10.patch

      - name: Fix SUSFS set_nameidata argument mismatch
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          sed -i 's/set_nameidata(nd, old_dfd, fake_filename, NULL);/set_nameidata(nd, old_dfd, fake_filename);/g' fs/namei.c

      - name: Revert android12-5.10 pre-patch compatibility fixes
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          if [ "${SUBLEVEL}" -le "43" ]; then
            sed -i 's/^size_t this_len = min_t(size_t, count, PAGE_SIZE);$/int this_len = min_t(int, count, PAGE_SIZE);/' fs/proc/base.c
          fi
          if [ "${SUBLEVEL}" -le "117" ]; then
            perl -i -pe 's#^(\s+if \(inode\)\s+\{)#$1\n\t\t/*\n\t\t * IN_ALL_EVENTS represents all of the mask bits\n\t\t * that we expose to userspace.  There is at\n\t\t * least one bit (FS_EVENT_ON_CHILD) which is\n\t\t * used only internally to the kernel.\n\t\t */\n\t\tu32 mask = mark->mask \& IN_ALL_EVENTS;#m' fs/notify/fdinfo.c
            perl -i -pe 's/\binotify_mark_user_mask\(mark\)/mask, mark->ignored_mask/g' fs/notify/fdinfo.c
            perl -i -pe 's/ignored_mask:0/ignored_mask:%x/g' fs/notify/fdinfo.c
          fi

      - name: Apply SUSFS show_pad fix
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          if [ "${SUBLEVEL}" -le "209" ]; then
            sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
          fi

      - name: Setup KernelSU (official tiann)
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          # Official KernelSU — yeh drivers/ provide karta hai
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash
          # Verify drivers/ directory exist karti hai
          if [ ! -d "drivers" ]; then
            echo "::error::drivers/ directory still missing"
            exit 1
          fi
          echo "KernelSU driver integrated successfully"

      - name: Apply SUSFS KernelSU integration patch
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          # Find the KernelSU directory (either KernelSU or KernelSU-KOWX712)
          KSU_DIR=""
          if [ -d "KernelSU" ]; then
            KSU_DIR="KernelSU"
          elif [ -d "KernelSU-KOWX712" ]; then
            KSU_DIR="KernelSU-KOWX712"
          fi
          if [ -z "$KSU_DIR" ]; then
            echo "::error::KernelSU directory not found"
            exit 1
          fi
          
          cp ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./$KSU_DIR/ 2>/dev/null || \
          cp ../susfs4ksu/kernel_patches/10_enable_susfs_for_ksu.patch ./$KSU_DIR/
          cd $KSU_DIR
          # Apply patch; may partially fail but that's OK for SUSFS integration
          patch -p1 --fuzz=3 < 10_enable_susfs_for_ksu.patch || {
            echo "::warning::SUSFS KSU patch partially failed, continuing..."
          }
          cd ..
          echo "SUSFS KSU integration patch applied (with possible fuzz)"

      - name: Apply ksu_susfs_fixup.sh for compatibility (if needed)
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          # Find KernelSU directory
          KSU_DIR=""
          if [ -d "KernelSU" ]; then
            KSU_DIR="KernelSU"
          elif [ -d "KernelSU-KOWX712" ]; then
            KSU_DIR="KernelSU-KOWX712"
          fi
          
          curl -fsSL -o /tmp/ksu_susfs_fixup.sh \
            https://raw.githubusercontent.com/IRedDragonICY/konoha-kernel-gki/main/ksu_susfs_fixup.sh
          chmod +x /tmp/ksu_susfs_fixup.sh
          # Run fixup for KOWX712 (treat as official KernelSU)
          bash /tmp/ksu_susfs_fixup.sh "$(pwd)/$KSU_DIR/kernel" || {
            echo "::warning::fixup script reported errors, continuing..."
          }
          # Also run for kernel root fixes
          bash /tmp/ksu_susfs_fixup.sh "$(pwd)/$KSU_DIR/kernel" || true

      - name: Setup Baseband Guard (BBG)
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 \
            https://raw.githubusercontent.com/vc-teahouse/Baseband-guard/main/setup.sh | bash
          echo "BBG_COMMIT=$(git -C Baseband-guard rev-parse --short HEAD 2>/dev/null || echo unknown)" >> "$GITHUB_ENV"

      - name: Configure Baseband Guard LSM
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
          if ! grep -q "baseband_guard" security/Kconfig; then
            echo "::error::baseband_guard not found in security/Kconfig after patch — BBG setup likely failed"
            exit 1
          fi
          echo "[+] baseband_guard wired into security/Kconfig:"
          grep -n "baseband_guard" security/Kconfig || true

      - name: Set Baseband Guard Config
        run: |
          cd kernel_workspace/common/arch/arm64/configs
          echo "CONFIG_BBG=y" >> gki_defconfig

      - name: Apply BBRv3 backport
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/WildKernels/kernel_patches.git /tmp/wildpatches
          BBRV3_PATCH="/tmp/wildpatches/common/bbrv3/0001-net-tcp-backport-BBRv3-to-android12-5.10.patch"
          BBR_CONG_NAME="bbr"
          BBRV3_PATCH_APPLIED="false"
          if [ -f "$BBRV3_PATCH" ] && patch -p1 < "$BBRV3_PATCH"; then
            BBRV3_PATCH_APPLIED="true"
            DETECTED="$(grep -rhoE '\.name\s*=\s*"[a-zA-Z0-9_]+"' net/ipv4/tcp_bbr*.c 2>/dev/null | grep -oE '"[a-zA-Z0-9_]+"' | tr -d '"' | head -n1 || true)"
            [ -n "$DETECTED" ] && BBR_CONG_NAME="$DETECTED"
          fi
          echo "BBR_CONG_NAME=${BBR_CONG_NAME}" >> "$GITHUB_ENV"
          echo "BBRV3_PATCH_APPLIED=${BBRV3_PATCH_APPLIED}" >> "$GITHUB_ENV"

      - name: Set networking / TCP congestion configs
        run: |
          cd kernel_workspace/common/arch/arm64/configs
          {
            echo "CONFIG_TCP_CONG_ADVANCED=y"
            echo "CONFIG_TCP_CONG_BBR=y"
            echo "CONFIG_TCP_CONG_CUBIC=y"
            echo "CONFIG_TCP_CONG_BIC=y"
            echo "CONFIG_TCP_CONG_WESTWOOD=y"
            echo "CONFIG_TCP_CONG_HTCP=y"
            if [ "${BBRV3_PATCH_APPLIED}" = "true" ]; then
              echo "CONFIG_TCP_CONG_BBR3=y"
            fi
            echo "CONFIG_DEFAULT_TCP_CONG=${BBR_CONG_NAME}"
            echo "CONFIG_NET_SCH_FQ=y"
            echo "CONFIG_NET_SCH_FQ_CODEL=y"
            echo "CONFIG_NET_SCH_CAKE=y"
          } >> gki_defconfig

      - name: Apply NTSync patches
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          if [ "${SUBLEVEL}" -le "208" ]; then
            curl -fsSL -o /tmp/0003-lockdep-assert-none-held.patch \
              https://raw.githubusercontent.com/WildKernels/GKI_KernelSU_SUSFS/main/.github/actions/ntsync/patches/0003-lockdep-assert-none-held.patch
            patch -p1 -N < /tmp/0003-lockdep-assert-none-held.patch || true
          fi
          curl -fsSL -o /tmp/ntsync_compat_android12-5.10.patch \
            https://raw.githubusercontent.com/WildKernels/kernel_patches/main/common/ntsync/ntsync_compat_android12-5.10.patch
          patch -p1 < /tmp/ntsync_compat_android12-5.10.patch || true
          curl -fsSL -o /tmp/ntsync_base.patch \
            https://raw.githubusercontent.com/WildKernels/kernel_patches/main/common/ntsync/ntsync_base.patch
          patch -p1 < /tmp/ntsync_base.patch || true
          echo "CONFIG_NTSYNC=y" >> arch/arm64/configs/gki_defconfig

      - name: Apply Droidspaces kABI-safe patches
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          DROIDSPACES_KABI_OK="true"
          curl -fsSL -o /tmp/droidspaces_sysvipc_kabi.patch \
            https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
          if ! patch -p1 < /tmp/droidspaces_sysvipc_kabi.patch; then
            DROIDSPACES_KABI_OK="false"
          fi
          curl -fsSL -o /tmp/droidspaces_posix_mqueue_kabi.patch \
            https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch
          if ! patch -p1 < /tmp/droidspaces_posix_mqueue_kabi.patch; then
            DROIDSPACES_KABI_OK="false"
          fi
          echo "DROIDSPACES_KABI_OK=${DROIDSPACES_KABI_OK}" >> "$GITHUB_ENV"

      - name: Set Droidspaces configs
        run: |
          cd kernel_workspace/common/arch/arm64/configs
          if [ "${DROIDSPACES_KABI_OK}" = "true" ]; then
            {
              echo "CONFIG_SYSVIPC=y"
              echo "CONFIG_SYSVIPC_SYSCTL=y"
              echo "CONFIG_POSIX_MQUEUE=y"
              echo "CONFIG_POSIX_MQUEUE_SYSCTL=y"
              echo "CONFIG_IPC_NS=y"
            } >> gki_defconfig
          fi
          {
            echo "CONFIG_NAMESPACES=y"
            echo "CONFIG_NET_NS=y"
            echo "CONFIG_CGROUPS=y"
            echo "CONFIG_PID_NS=y"
            echo "CONFIG_USER_NS=y"
            echo "CONFIG_DEVTMPFS=y"
            echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y"
            echo "CONFIG_NETFILTER_XT_TARGET_REJECT=y"
            echo "CONFIG_NETFILTER_XT_TARGET_LOG=y"
            echo "CONFIG_NETFILTER_XT_MATCH_RECENT=y"
            echo "CONFIG_IP_SET=y"
            echo "CONFIG_IP_SET_HASH_IP=y"
            echo "CONFIG_IP_SET_HASH_NET=y"
            echo "CONFIG_NETFILTER_XT_SET=y"
            echo "CONFIG_TMPFS_POSIX_ACL=y"
            echo "CONFIG_TMPFS_XATTR=y"
          } >> gki_defconfig

      - name: Apply gaming/latency perf tuning
        if: ${{ github.event.inputs.enable_gaming_perf_tune == 'true' }}
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          patch_default() {
            local label="$1" old_re="$2" new="$3"; shift 3
            local files=("$@")
            local d='/'
            for f in "${files[@]}"; do
              [ -f "$f" ] || continue
              if grep -qE -- "$old_re" "$f"; then
                if sed -i -E "s${d}${old_re}${d}${new}${d}" "$f"; then
                  echo "  [ok] ${label} (in $f)"
                  return 0
                else
                  echo "::warning::gaming-perf-tune: '${label}' matched in $f but sed edit failed, skipped"
                  return 1
                fi
              fi
            done
            echo "::warning::gaming-perf-tune: '${label}' pattern not found, skipped (kernel version drift)"
            return 1
          }

          echo "Kconfig: allow force-loading mismatched vendor modules"
          echo "CONFIG_MODULE_FORCE_LOAD=y" >> arch/arm64/configs/gki_defconfig

          echo "Reducing VFS cache pressure default (fs/dcache.c)"
          patch_default "vfs_cache_pressure default 100->50" \
            'int[[:space:]]+sysctl_vfs_cache_pressure[[:space:]]+__read_mostly[[:space:]]*=[[:space:]]*100;' \
            'int sysctl_vfs_cache_pressure __read_mostly = 50;' \
            fs/dcache.c || true

          echo "Reducing freeze timeout (kernel/power/process.c, 20s->1s)"
          patch_default "freeze_timeout_msecs 20000->1000" \
            'freeze_timeout_msecs[[:space:]]*=[[:space:]]*20[[:space:]]*\*[[:space:]]*MSEC_PER_SEC;' \
            'freeze_timeout_msecs = 1 * MSEC_PER_SEC;' \
            kernel/power/process.c kernel/power/main.c kernel/power/suspend.c || true

          echo "Reducing F2FS urgent GC sleep time (fs/f2fs/gc.h, 500ms->50ms)"
          patch_default "F2FS urgent GC sleep 500->50" \
            '#define[[:space:]]+DEF_GC_THREAD_URGENT_SLEEP_TIME[[:space:]]+500' \
            '#define DEF_GC_THREAD_URGENT_SLEEP_TIME\t50' \
            fs/f2fs/gc.h fs/f2fs/f2fs.h || true

          echo "Increasing PCI PME poll timeout (drivers/pci/pci.c, 1s->4s)"
          patch_default "PME_TIMEOUT 1000->4000" \
            '#define[[:space:]]+PME_TIMEOUT[[:space:]]+1000' \
            '#define PME_TIMEOUT\t4000' \
            drivers/pci/pci.c || true

          echo "Raising cpuidle teo governor default rating"
          patch_default "teo governor rating 19->25" \
            '\.rating[[:space:]]*=[[:space:]]*19,' \
            '.rating =\t25,' \
            drivers/cpuidle/governors/teo.c || true

          echo "Raising ext4 default journal commit interval (5s->30s)"
          patch_default "ext4/jbd2 commit interval 5s->30s" \
            '#define[[:space:]]+JBD2_DEFAULT_MAX_COMMIT_AGE[[:space:]]+5' \
            '#define JBD2_DEFAULT_MAX_COMMIT_AGE\t30' \
            include/linux/jbd2.h fs/jbd2/journal.c || true

          echo "Lowering vm_swappiness default (60->30) for less aggressive swapping"
          patch_default "vm_swappiness 60->30" \
            'int[[:space:]]+vm_swappiness[[:space:]]*=[[:space:]]*60;' \
            'int vm_swappiness = 30;' \
            mm/vmscan.c || true

          echo "Reducing CFS scheduler latency (6ms->4ms) for snappier task switching"
          patch_default "sysctl_sched_latency 6000000->4000000" \
            'unsigned[[:space:]]+int[[:space:]]+sysctl_sched_latency[[:space:]]*=[[:space:]]*6000000ULL;' \
            'unsigned int sysctl_sched_latency = 4000000ULL;' \
            kernel/sched/fair.c || true

          echo "Reducing CFS min granularity (0.75ms->0.5ms)"
          patch_default "sysctl_sched_min_granularity 750000->500000" \
            'unsigned[[:space:]]+int[[:space:]]+sysctl_sched_min_granularity[[:space:]]*=[[:space:]]*750000ULL;' \
            'unsigned int sysctl_sched_min_granularity = 500000ULL;' \
            kernel/sched/fair.c || true

          echo "Reducing CFS wakeup granularity (1ms->0.5ms) for faster preemption on wake"
          patch_default "sysctl_sched_wakeup_granularity 1000000->500000" \
            'unsigned[[:space:]]+int[[:space:]]+sysctl_sched_wakeup_granularity[[:space:]]*=[[:space:]]*1000000UL;' \
            'unsigned int sysctl_sched_wakeup_granularity = 500000UL;' \
            kernel/sched/fair.c || true

          echo "Reducing task migration cost (0.5ms->0.25ms) for faster load balancing across cores"
          patch_default "sysctl_sched_migration_cost 500000->250000" \
            'const_debug[[:space:]]+unsigned[[:space:]]+int[[:space:]]+sysctl_sched_migration_cost[[:space:]]*=[[:space:]]*500000UL;' \
            'const_debug unsigned int sysctl_sched_migration_cost = 250000UL;' \
            kernel/sched/fair.c || true

          echo "Raising vm.max_map_count default (65530->1048576) for mmap-heavy games/emulators"
          patch_default "DEFAULT_MAX_MAP_COUNT (USHRT_MAX-5)->1048576" \
            '#define[[:space:]]+DEFAULT_MAX_MAP_COUNT[[:space:]]*\([[:space:]]*USHRT_MAX[[:space:]]*-[[:space:]]*MAPCOUNT_ELF_CORE_MARGIN[[:space:]]*\)' \
            '#define DEFAULT_MAX_MAP_COUNT (1048576)' \
            include/linux/mm.h || true

          echo "Lowering dirty_background_ratio (10->5) to complement dirty_ratio tweak"
          patch_default "dirty_background_ratio 10->5" \
            'int[[:space:]]+dirty_background_ratio[[:space:]]*=[[:space:]]*10;' \
            'int dirty_background_ratio = 5;' \
            mm/page-writeback.c || true

          echo "Reducing dirty page expire interval (30s->10s) to avoid large writeback stalls"
          patch_default "dirty_expire_interval 3000->1000 (centisecs)" \
            'unsigned[[:space:]]+int[[:space:]]+dirty_expire_interval[[:space:]]*=[[:space:]]*30[[:space:]]*\*[[:space:]]*100;' \
            'unsigned int dirty_expire_interval = 10 * 100;' \
            mm/page-writeback.c || true

          echo "Raising min_free_kbytes floor slightly for smoother allocs under memory pressure"
          patch_default "min_free_kbytes floor 128->256 (in pages, KB)" \
            'int[[:space:]]+min_free_kbytes[[:space:]]*=[[:space:]]*1024;' \
            'int min_free_kbytes = 2048;' \
            mm/page_alloc.c || true

          echo "Lowering dirty_ratio default for snappier writeback under load"
          patch_default "vm dirty_ratio 20->10" \
            'int[[:space:]]+vm_dirty_ratio[[:space:]]*=[[:space:]]*20;' \
            'int vm_dirty_ratio = 10;' \
            mm/page-writeback.c || true

          echo "Enabling 1000Hz kernel tick (lower scheduling latency)"
          echo "CONFIG_HZ_1000=y" >> arch/arm64/configs/gki_defconfig

          echo "Enabling Kyber/Deadline I/O schedulers"
          echo "CONFIG_MQ_IOSCHED_KYBER=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_MQ_IOSCHED_DEADLINE=y" >> arch/arm64/configs/gki_defconfig

      - name: Apply custom kernel branding
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          mv scripts/setlocalversion scripts/setlocalversion.orig
          chmod +x scripts/setlocalversion.orig
          cat > scripts/setlocalversion << 'EOF'
          #!/bin/sh
          printf -- '-BLAZE-STABLE-V1'
          EOF
          chmod +x scripts/setlocalversion

      - name: Disable strict defconfig verification
        working-directory: kernel_workspace
        run: sed -i 's/check_defconfig//' ./common/build.config.gki

      - name: Disable strict GKI modules list verification
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          grep -rl '^MODULES_ORDER=' build.config* 2>/dev/null | xargs -r sed -i 's/^MODULES_ORDER=.*/MODULES_ORDER=/' || true
          grep -rl '^MODULES_LIST=' build.config* 2>/dev/null | xargs -r sed -i 's/^MODULES_LIST=.*/MODULES_LIST=/' || true

      - name: Ensure generic ld exists for tools that don't pass -fuse-ld=lld
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          LLD_PATH=$(find prebuilts-master -type f -name 'ld.lld' | head -n1)
          if [ -n "$LLD_PATH" ]; then
            BIN_DIR=$(dirname "$LLD_PATH")
            [ -e "$BIN_DIR/ld" ] || ln -s ld.lld "$BIN_DIR/ld"
            echo "Symlinked ld -> ld.lld in $BIN_DIR"
          else
            echo "::warning::no ld.lld found under prebuilts-master"
          fi

      - name: Build kernel with Stock Clang
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          LTO=thin \
          SKIP_MRPROPER=1 \
          BUILD_CONFIG=common/build.config.gki.aarch64 \
          USE_CCACHE=1 \
          CCACHE_DIR="${CCACHE_DIR}" \
          LLVM=1 \
          LLVM_IAS=1 \
          build/build.sh -j"$(nproc)"
          
      - name: Verify final configs
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          CFG=$(find out -name ".config" | head -n1)
          [ -n "$CFG" ]
          for SYM in CONFIG_NAMESPACES CONFIG_NET_NS CONFIG_PID_NS CONFIG_CGROUPS CONFIG_USER_NS CONFIG_BPF_SYSCALL CONFIG_UNICODE CONFIG_BBG CONFIG_KSU CONFIG_KSU_SUSFS; do
            grep -q "^${SYM}=y$" "$CFG" || echo "::warning::${SYM} not set"
          done

      - name: Locate built Image
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          IMG=$(find out -path "*dist/Image" | head -n1)
          if [ -z "$IMG" ]; then
            IMG=$(find out -name "Image" | head -n1)
          fi
          [ -n "$IMG" ]
          echo "IMG_PATH=kernel_workspace/${IMG}" >> "$GITHUB_ENV"

      - name: Package AnyKernel3
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/WildKernels/AnyKernel3.git -b gki-2.0 ak3
          cp "${{ env.IMG_PATH }}" ak3/Image
          cd ak3
          zip -r9 -q "../${{ github.event.inputs.device_name }}-Blaze-android12-5.10-susfs${SUSFS_COMMIT:0:8}.zip" . -x ".git*"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.device_name }}-build
          path: "*.zip"
          retention-days: 14
